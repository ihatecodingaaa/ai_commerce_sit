{% extends "base.html" %}
{% block title %}Log in - ShopLite{% endblock %}
{% block content %}
<div class="card auth-card">
  <div class="accent-bar"></div>
  <h1>Welcome back</h1>
  <p class="muted" style="margin-bottom:1.25rem">Log in to view your orders and chat with support.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Username</label>
    <input type="text" name="username" required autofocus>
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit" class="btn btn-primary btn-block" style="margin-top:1.4rem">Log in</button>
  </form>
  <p class="muted" style="margin-top:1.25rem; text-align:center">No account? <a href="/register">Register</a></p>
</div>
{% endblock %}
